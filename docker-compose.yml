services:

   postgres:
    image: postgres:16
    container_name: serviops-postgres

    environment:
      POSTGRES_DB: serviops
      POSTGRES_USER: serviops
      POSTGRES_PASSWORD: serviops_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serviops -d serviops"]
      interval: 5s
      timeout: 5s
      retries: 5

   backend:
    build: ./backend
    container_name: serviops-backend

    env_file:
      - ./backend/.env

    environment:
      DATABASE_HOST: postgres

    ports:
      - "8000:8000"
    
    volumes:
      - uploads_data:/app/uploads

    depends_on:
     postgres:
      condition: service_healthy

   frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000

    container_name: serviops-frontend

    ports:
       - "5173:80"

volumes:
  postgres_data:
  uploads_data:

 